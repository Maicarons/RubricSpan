# M1 打标流水线配置（对应执行计划 M1-1 ~ M1-6）
# 环境变量（.env）：多端点 fallback 队列 LLM_ENDPOINT_<n>_{BASE_URL,API_KEY,MODEL[,NAME]}
# （n 升序 = 调用优先级；某端点重试耗尽自动冷却并切下一个，冷却到期探活恢复）；
# 未配置编号端点时回落到单端点 OPENAI_BASE_URL / OPENAI_API_KEY / LABELING_MODEL；
# LLM_TIMEOUT_SECS 为全端点共享超时。

pipeline:
  # 种子题源（data/raw/sas-bench/ 下文件名去掉 .jsonl）
  subjects: [1_History_ShortAns, 8_Political_ShortAns, 3_Geography_ShortAns]
  # 备用学科（对齐样本不足 3000 时启用）
  reserve_subjects: [6_Chinese_ShortAns]
  random_seed: 42

client:
  concurrency: 16           # 并发请求数（8/12 均稳定，打标阶段提到 16）
  max_attempts: 4           # 单端点内单调用重试次数（429/5xx/超时/JSON 解析失败）
  backoff_base_secs: 2.0
  max_tokens_initial: 3072  # 推理模型：reasoning 占用 completion 预算，需放大
  max_tokens_max: 8192      # content=None(finish=length) 时翻倍重试的上限
  temperature_default: 0.1
  fallback_cooldown_secs: 60     # 端点整轮重试耗尽后的冷却时长（连败逐次翻倍）
  fallback_cooldown_max_secs: 600  # 冷却时长上限；到期单线程探活，恢复即回到该端点

parse_points:
  # 参考答案 → 评分配置（得分点拆分 + 权重分配 + 同义别名）
  max_points: 10            # 单题得分点上限（超出由模型合并次要点）

synth:
  # 四档合成答卷（M1-2）：优秀/良好/及格/不及格
  variants_per_tier: 1      # 每题每档份数（历史题加做第 2 份变体）
  history_extra_variants: 1
  tiers: [excellent, good, fair, poor]

label:
  # 批量打标（M1-3）
  fragment_samples: 900     # 抽取的 steps 片段样本数（自然含得分点遗漏 → 负样本源）
  fragment_miss_ratio: 0.25 # 片段中 0 分步骤的采样占比（其余取有分步骤）

selfcheck:
  # 自一致性校验（M1-4）：多温度多次调用 + 多数投票
  votes: 3                  # 含首轮流的总票数（=2 表示追加 1 轮）
  temperatures: [0.7, 1.1]  # 首轮 0.1 之外的追加温度
  max_samples: 400          # 高价值样本上限（semantic 命中或低置信）
  low_confidence: 0.75

quality:
  # 质量控制（M1-6）
  min_confidence: 0.55      # 点级置信下限，低于则丢弃该点标注
  max_span_ratio: 0.5       # span 长度超过学生答案该比例视为抽取异常
  max_invalid_point_ratio: 0.34  # 单样本无效点占比上限（超过丢弃整样本）
  inspection_ratio: 0.05    # 人工抽检比例（分层抽样导出）
