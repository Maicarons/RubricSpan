[project]
name = "rubricspan-train"
version = "0.1.0"
description = "主观题阅卷教师模型 · 训练流水线（打标 / 对齐 / 训练 / 评估 / 导出）"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "openai>=1.40",          # OpenAI 兼容接口（打标 / 标准答案解析）
    "torch>=2.3",            # 训练框架（CUDA 12 版按官方指引安装）
    "transformers>=4.44",    # MRC 微调
    "sentence-transformers>=3.0",  # 相似度模型微调
    "datasets>=2.20",        # 数据集加载（SAS-Bench / CMRC 等）
    "onnx>=1.16",            # ONNX 导出
    "onnxruntime>=1.18",     # 导出自检与一致性校验
    "optimum>=1.21",         # transformers → ONNX 便捷导出
    "jsonschema>=4.23",      # 打标输出契约校验
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.5",     # 评估指标（F1 / Pearson / Kappa）
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
ocr = [
    "rapidocr-onnxruntime>=1.3",  # RapidOCR 本地验证（M0-6）
    "opencv-python-headless>=4.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
